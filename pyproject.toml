[project]
name = "crypto-strategy-research-lab"
version = "0.1.0"
description = "A reproducible research system for testing systematic crypto trading strategies."
authors = [{name = "Mohammad Darang"}]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "requests>=2.31",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.28"]
dev = ["pytest>=7.4", "ruff>=0.1.0"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
